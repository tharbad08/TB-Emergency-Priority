name: Build standalone 1.1 compatibility assembly

on:
  push:
    branches: [ main ]
    paths:
      - 'StandaloneCompat/**'
      - '.github/workflows/build-standalone-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build compatibility assembly
        run: dotnet build StandaloneCompat/EmergencyPriority.V11Compat.csproj -c Release
      - name: Stage artifact
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/ep-v11"
          cp StandaloneCompat/bin/Release/netstandard2.1/EmergencyPriority.V11Compat.dll "$RUNNER_TEMP/ep-v11/"
          cp StandaloneCompat/manifest.json "$RUNNER_TEMP/ep-v11/"
      - uses: actions/upload-artifact@v4
        with:
          name: EmergencyPriority.V11Compat
          path: ${{ runner.temp }}/ep-v11/
