name: Build Emergency Priority 1.1 Compat

on:
  push:
    branches: [ main ]
    paths:
      - 'EmergencyPriorityCompatAudit/**'
      - '.github/workflows/build-emergency-priority-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build EmergencyPriorityCompatAudit/EmergencyPriorityCompatAudit.csproj -c Release
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$RUNNER_TEMP/EmergencyPriorityCompatAudit"
          mkdir -p "$ROOT/version-1.1/Scripts"
          cp EmergencyPriorityCompatAudit/manifest.json "$ROOT/version-1.1/manifest.json"
          cp EmergencyPriorityCompatAudit/bin/Release/netstandard2.1/EmergencyPriorityCompatAudit.dll "$ROOT/version-1.1/Scripts/"
          cd "$RUNNER_TEMP"
          zip -r EmergencyPriorityCompatAudit_0.1.0.zip EmergencyPriorityCompatAudit
      - uses: actions/upload-artifact@v4
        with:
          name: EmergencyPriorityCompatAudit_0.1.0
          path: ${{ runner.temp }}/EmergencyPriorityCompatAudit_0.1.0.zip
